<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Tidepool — interactive terminal portfolio">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1114"/><stop offset="1" stop-color="#141e23"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c1215"/><stop offset="1" stop-color="#080b0c"/></linearGradient>
    <linearGradient id="fadeg" gradientUnits="userSpaceOnUse" x1="0" y1="478" x2="0" y2="632">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/><stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="470" width="1280" height="170">
      <rect x="0" y="470" width="1280" height="170" fill="url(#fadeg)"/>
    </mask>
    <filter id="soften" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <clipPath id="winclip"><rect x="280" y="70" width="720" height="360" rx="12"/></clipPath>
  </defs>

  <rect width="1280" height="640" fill="url(#sky)"/>

  <!-- Stars -->
  <circle cx="150" cy="80" r="2.6" fill="#63736f"/>
  <circle cx="240" cy="150" r="2" fill="#63736f"/>
  <circle cx="420" cy="58" r="2.4" fill="#63736f"/>
  <circle cx="870" cy="50" r="2.2" fill="#6bdcff"/>
  <circle cx="1062" cy="108" r="2.8" fill="#63736f"/>
  <circle cx="1180" cy="192" r="2.2" fill="#63736f"/>
  <circle cx="90" cy="262" r="2" fill="#63736f"/>
  <circle cx="1226" cy="58" r="2.6" fill="#63736f"/>

  <!-- Water -->
  <rect x="0" y="470" width="1280" height="170" fill="url(#water)"/>

  <!-- Terminal window (defined once, reused for the reflection) -->
  <g id="win">
    <rect x="280" y="70" width="720" height="360" rx="12" fill="#0e1214" stroke="#2a363d" stroke-width="1.5"/>
    <g clip-path="url(#winclip)">
      <rect x="280" y="70" width="720" height="44" fill="#13191c"/>
      <line x1="280" y1="114" x2="1000" y2="114" stroke="#2a363d" stroke-width="1.5"/>
    </g>
    <text x="308" y="99" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" font-weight="700" fill="#63f2ab">&#10095;</text>
    <text x="332" y="98" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="11.5" font-weight="700" letter-spacing="1.5" fill="#879994">VISITOR@REAL-FRUIT-SNACKS: ~</text>
    <text x="972" y="98" text-anchor="end" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="11.5" font-weight="700" letter-spacing="1.5" fill="#63736f">TIDEPOOL 1.0</text>

    <text x="316" y="152" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" font-weight="700" fill="#63f2ab">$</text>
    <text x="334" y="152" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" fill="#b4c3bd">./tidepool</text>

    <!-- Wordmark: TIDEPOOL in JetBrains Mono ExtraBold (converted to paths) + cursor block -->
    <g transform="translate(340,268) scale(1.03)">
      <path fill="#dce4df" d="M37.50 0L22.50 0L22.50-59.50L4-59.50L4-73L56-73L56-59.50L37.50-59.50 M118 0L74 0L74-13.50L88.50-13.50L88.50-59.50L74-59.50L74-73L118-73L118-59.50L103.50-59.50L103.50-13.50L118-13.50 M162 0L138.30 0L138.30-73L162-73Q169.60-73 175.25-70.10Q180.90-67.20 184.05-61.95Q187.20-56.70 187.20-49.60L187.20-23.50Q187.20-16.50 184.05-11.20Q180.90-5.90 175.25-2.95Q169.60 0 162 0M153.30-59.50L153.30-13.50L162-13.50Q166.50-13.50 169.35-16.30Q172.20-19.10 172.20-23.50L172.20-49.60Q172.20-54 169.35-56.75Q166.50-59.50 162-59.50 M251 0L206 0L206-73L251-73L251-60L220.70-60L220.70-43.60L247.50-43.60L247.50-31.20L220.70-31.20L220.70-13L251-13 M285.60 0L270.60 0L270.60-73L295.50-73Q303.20-73 308.95-70.10Q314.70-67.20 317.85-62Q321-56.80 321-49.80Q321-42.90 317.80-37.65Q314.60-32.40 308.90-29.50Q303.20-26.60 295.50-26.60L285.60-26.60L285.60 0M285.60-60L285.60-39.60L295.50-39.60Q300.30-39.60 303.15-42.50Q306-45.40 306-49.80Q306-54.20 303.15-57.10Q300.30-60 295.50-60 M360 1Q349 1 342.50-5.20Q336-11.40 336-22L336-51Q336-61.70 342.50-67.85Q349-74 360-74Q371-74 377.50-67.85Q384-61.70 384-51L384-22Q384-11.40 377.50-5.20Q371 1 360 1M360-12Q369-12 369-21L369-52Q369-61 360-61Q351-61 351-52L351-21Q351-12 360-12 M426 1Q415 1 408.50-5.20Q402-11.40 402-22L402-51Q402-61.70 408.50-67.85Q415-74 426-74Q437-74 443.50-67.85Q450-61.70 450-51L450-22Q450-11.40 443.50-5.20Q437 1 426 1M426-12Q435-12 435-21L435-52Q435-61 426-61Q417-61 417-52L417-21Q417-12 426-12 M518 0L473.50 0L473.50-73L488.50-73L488.50-13.50L518-13.50"/>
      <rect x="540" y="-73" width="42" height="73" fill="#63f2ab"/>
    </g>

    <text x="640" y="312" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" font-weight="700" letter-spacing="6" fill="#879994">INTERACTIVE TERMINAL PORTFOLIO</text>

    <!-- Tag chips -->
    <g font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="12" font-weight="700">
      <rect x="484" y="350" width="88" height="26" rx="4" fill="#63f2ab" fill-opacity="0.13" stroke="#63f2ab" stroke-opacity="0.28"/>
      <text x="528" y="367" text-anchor="middle" fill="#63f2ab">xterm.js</text>
      <rect x="586" y="350" width="100" height="26" rx="4" fill="#6bdcff" fill-opacity="0.13" stroke="#6bdcff" stroke-opacity="0.28"/>
      <text x="636" y="367" text-anchor="middle" fill="#6bdcff">virtual fs</text>
      <rect x="700" y="350" width="96" height="26" rx="4" fill="#f0c674" fill-opacity="0.13" stroke="#f0c674" stroke-opacity="0.28"/>
      <text x="748" y="367" text-anchor="middle" fill="#f0c674">zero deps</text>
    </g>
  </g>

  <!-- Reflection in the pool -->
  <g opacity="0.17" mask="url(#fade)" filter="url(#soften)">
    <use href="#win" xlink:href="#win" transform="matrix(1,0,0,-1,0,940)"/>
  </g>

  <!-- Water line and ripples -->
  <line x1="0" y1="470" x2="1280" y2="470" stroke="#39484f" stroke-width="2"/>
  <g fill="none" stroke="#6bdcff">
    <ellipse cx="640" cy="520" rx="190" ry="13" stroke-width="2" opacity="0.24"/>
    <ellipse cx="640" cy="520" rx="300" ry="21" stroke-width="2" opacity="0.15"/>
    <ellipse cx="640" cy="520" rx="420" ry="30" stroke-width="2" opacity="0.08"/>
  </g>

  <!-- Cursor glow shimmering down the water -->
  <g stroke="#63f2ab" stroke-linecap="round">
    <line x1="888" y1="500" x2="948" y2="500" stroke-width="7" opacity="0.5"/>
    <line x1="894" y1="522" x2="942" y2="522" stroke-width="6.5" opacity="0.38"/>
    <line x1="899" y1="544" x2="937" y2="544" stroke-width="6" opacity="0.28"/>
    <line x1="903" y1="566" x2="933" y2="566" stroke-width="5.5" opacity="0.2"/>
    <line x1="907" y1="588" x2="929" y2="588" stroke-width="5" opacity="0.13"/>
    <line x1="910" y1="608" x2="926" y2="608" stroke-width="5" opacity="0.08"/>
  </g>

  <!-- Faint surface streaks -->
  <g stroke="#39484f" stroke-linecap="round">
    <line x1="90" y1="508" x2="190" y2="508" stroke-width="1.5" opacity="0.5"/>
    <line x1="1080" y1="542" x2="1185" y2="542" stroke-width="1.5" opacity="0.4"/>
    <line x1="170" y1="586" x2="252" y2="586" stroke-width="1.5" opacity="0.3"/>
    <line x1="1010" y1="500" x2="1062" y2="500" stroke-width="1.5" opacity="0.45"/>
  </g>
</svg>
